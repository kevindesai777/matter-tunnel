# Footprint stage 3 - security layer without client authentication.
#
# Reproduces the "+ signing, identity, replay, binding" row of the cost table.
# The device signs its responses and enforces the replay counter, but inbound
# requests are accepted unverified: the device is authenticated to the client,
# the client is not authenticated to the device. Measurement configuration only.

CONFIG_TUNNEL_CLIENT_AUTH=n
