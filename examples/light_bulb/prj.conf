# Derived from nrf/samples/matter/light_bulb/prj.conf. Everything that is not a
# VendorTunnel option is kept byte-identical to the upstream sample, including
# the product name and Bluetooth name: this build is differenced against the
# stock sample to price the component, and a renamed product would put its own
# string bytes inside that difference. (examples/lock does rename the product,
# so about two bytes of its reported delta are string, not code.)

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter Light Bulb"

# Configure ZAP file name - the bulb's own data model, with the tunnel cluster
# added to its dimmable-light endpoint. Its parent directory also holds the
# generated output, because CHIP_APP_ZAP_DIR is derived from this path.
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/../../zap/generated-bulb/bulb-tunnel.zap"

# 32773 == 0x8005 (example lighting-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32773
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y
CONFIG_PWM=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterLight"

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# --- VendorTunnel signing -------------------------------------------------
# Same choice as examples/lock, and for the same measured reason: Ed25519 via
# the Oberon software implementation beats CC310-accelerated P-256 on this part
# for both sign and verify, and enabling CryptoCell would make Ed25519
# unavailable outright.
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# No sleepy-device settings here, unlike examples/lock. A bulb is mains-powered
# and the upstream sample runs it as a Full Thread Device, which is rx-on-when-
# idle by construction. That is set in Kconfig, which is tracked, so the device
# under test is recorded rather than inherited from a build directory.
