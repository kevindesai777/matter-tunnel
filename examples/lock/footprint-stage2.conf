# Footprint stage 2 - the tunnel cluster and its opaque envelope, no cryptography.
#
# Reproduces the "transport only" row of the cost table: the cluster definition,
# the ZAP-generated dispatch and Encode/Decode, and the command handler with the
# echo command alone. Carries no authority; measurement configuration only.
#
# The PSA options are turned off here as well as the security layer itself.
# examples/lock/prj.conf requests Ed25519 for the component's own signing, and
# leaving that enabled would bill the crypto library to the transport stage.

CONFIG_TUNNEL_SECURITY=n

CONFIG_PSA_WANT_ALG_PURE_EDDSA=n
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=n
