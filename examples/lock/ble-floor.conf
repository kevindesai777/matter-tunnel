# Overlay for the BLE transport-floor measurement (condition 0).
#
# Adds a direct BLE carrier for the same tunnel envelope, so the Matter/Thread
# transport cost can be bounded. Kept as an overlay rather than in prj.conf so
# the measured Matter build (~/ncs-build/lock-tunnel) is unaffected.

# Nordic UART Service - raw byte carrier. Deliberately WITHOUT BT_NUS_AUTHEN:
# link-layer pairing is not the variable under test, and requiring it would add
# a bonding step to the measurement client. State this in the paper.
CONFIG_BT_NUS=y

# The signed request is 79 B and the signed response ~79 B; the default ATT MTU
# of 23 would fragment them and make the measurement a test of reassembly.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Two simultaneous links: Matter may hold one, the measurement client the other.
CONFIG_BT_MAX_CONN=2

# bt_gatt_exchange_mtu() lives behind the GATT client role. The device must be
# able to initiate the exchange because BlueZ (as central) did not, leaving the
# ATT MTU at 23 - which silently truncates every signed response.
CONFIG_BT_GATT_CLIENT=y
