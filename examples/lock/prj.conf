# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter Tunnel Lock"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/../../zap/generated/lock-tunnel.zap"

# 32774 == 0x8006 (example lock-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32774
CONFIG_STD_CPP17=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterLock"

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_CHIP_QSPI_NOR_POWER_MANAGEMENT_SUPPORT=n

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_CHIP_APP_LOG_LEVEL=3

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Enable Matter Access module
CONFIG_DOOR_LOCK_MATTER_ACCESS=y
CONFIG_DOOR_LOCK_MATTER_ACCESS_CREDENTIAL_TYPES_PIN=y

# --- VendorTunnel signing -------------------------------------------------
# Ed25519, chosen by measurement (2026-08-17): faster than CC310-accelerated
# P-256 on both sign and verify on this part, tighter distribution, 32-byte
# public key, and ~36 KB less flash than enabling CryptoCell.
# Deliberately NOT enabling CONFIG_PSA_CRYPTO_DRIVER_CC3XX: doing so makes
# Ed25519 unavailable (the CC3XX driver claims ECC key operations and does not
# implement Twisted Edwards curves).
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# --- Non-sleepy MED -------------------------------------------------------
# 🔴 Made explicit 2026-08-18. These were previously set only via an ad-hoc
# overlay (~/ncs-door-lock/med-measurement.conf) applied to the ~/ncs-build/
# lock-tunnel build directory, and were recorded in NO tracked file. A fresh
# `west build` of this example therefore produced a SLEEPY end device with
# CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=2500 - a ~2.3 s polling floor - which is
# NOT the firmware the Phase 5 measurements were taken on. The documented build
# command did not reproduce the measured artifact; it does now.
#
# Keep MTD rather than FTD: FTD adds Thread routing code and flash is tight.
CONFIG_OPENTHREAD_MTD_SED=n
CONFIG_CHIP_ENABLE_ICD_SUPPORT=n
